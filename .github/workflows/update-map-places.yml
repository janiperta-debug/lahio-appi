name: Update map places

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  import-map-places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import OSM places
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OSM_CENTERS: "61.0150966,24.4348754;60.6312,24.8614"
          OSM_RADIUS_KM: "25"
        run: node scripts/import-osm-map-places.mjs
